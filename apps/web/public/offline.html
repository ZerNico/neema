<!doctype html>
<!-- The service worker's answer to a page load with no network (sw.js). It is
     cached alone, so it carries everything it needs inline. -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>neema</title>
    <!-- The theme chosen in the app, under its key in src/ui/boot-scripts.ts; without one, the system's. -->
    <script>
      try {
        const theme = localStorage.getItem("theme");
        if (theme === "light" || theme === "dark") document.documentElement.dataset.theme = theme;
      } catch {}
    </script>
    <style>
      :root {
        color-scheme: light;
        --background: #ffffff;
        --foreground: #171717;
        --muted: #737373;
        --border: #e5e5e5;
      }
      :root[data-theme="dark"] {
        color-scheme: dark;
        --background: #171717;
        --foreground: #fafafa;
        --muted: #a3a3a3;
        --border: #2e2e2e;
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) {
          color-scheme: dark;
          --background: #171717;
          --foreground: #fafafa;
          --muted: #a3a3a3;
          --border: #2e2e2e;
        }
      }
      body {
        margin: 0;
        min-height: 100svh;
        display: grid;
        place-items: center;
        background: var(--background);
        color: var(--foreground);
        font:
          14px/1.5 ui-sans-serif,
          system-ui,
          sans-serif;
        text-align: center;
      }
      svg {
        width: 48px;
        height: 48px;
      }
      h1 {
        margin: 16px 0 4px;
        font-size: 16px;
        font-weight: 600;
      }
      p {
        margin: 0 0 20px;
        color: var(--muted);
      }
      a {
        display: inline-block;
        padding: 6px 14px;
        border: 1px solid var(--border);
        border-radius: 8px;
        color: inherit;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <main>
      <svg viewBox="0 0 64 64" fill="none" aria-hidden="true">
        <rect
          x=".5"
          y=".5"
          width="63"
          height="63"
          rx="15"
          fill="#171717"
          stroke="#fff"
          stroke-opacity=".12"
        />
        <path
          d="M42 46V30a10 10 0 0 0-20 0v11.5c0 3-2 5.4-5 6"
          stroke="#fafafa"
          stroke-width="7"
          stroke-linecap="round"
          stroke-linejoin="round"
        />
        <circle cx="47.5" cy="17.5" r="3.5" fill="#fafafa" />
      </svg>
      <h1>You’re offline</h1>
      <p>neema opens again once you’re connected.</p>
      <!-- An empty href is the address that failed to load. -->
      <a href="">Try again</a>
    </main>
    <script>
      addEventListener("online", () => location.reload());
    </script>
  </body>
</html>
