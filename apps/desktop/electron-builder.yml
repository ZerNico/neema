# Packaging for release builds (`pnpm package`). Unsigned: macOS gets an
# ad-hoc signature so Apple Silicon will run it, and Gatekeeper still asks on
# first launch; Windows shows SmartScreen. Signing needs certificates, not code.
#
# Only `dependencies` are packed. esbuild bundles everything else into dist/,
# which is why effect, diff and friends are devDependencies of this package.
appId: app.neema.desktop
productName: neema
copyright: Copyright © Nico Franke
artifactName: ${productName}-${version}-${os}-${arch}.${ext}

directories:
  output: release
  buildResources: build-resources

files:
  - dist/**/*
  - "!dist/**/*.map"
  - static/**/*
  - "!static/icons/*.svg"
  - package.json

# The MXC SDK runs executor binaries and loads a native library from paths
# beside its own modules. Inside an asar those cannot be executed, so the app
# stays a plain directory, as it is in dev.
asar: false

protocols:
  - name: neema sign-in
    schemes: [chat-desktop]

mac:
  icon: static/icons/icon.png
  category: public.app-category.productivity
  target: [dmg, zip]
  identity: "-"
  hardenedRuntime: false

win:
  icon: static/icons/icon.png
  target: [nsis]

nsis:
  # The sandbox account starts srt-win.exe from the install directory. Under a
  # per-user install that is the profile, which the account cannot read.
  perMachine: true
  oneClick: false
  allowToChangeInstallationDirectory: true

linux:
  # Otherwise derived from the package name, whose @ and / Linux targets refuse.
  executableName: neema
  icon: static/icons/icon.png
  category: Utility
  target: [AppImage, deb]
  maintainer: Nico Franke <nico.franke01@gmail.com>
  synopsis: neema desktop shell

publish: null
