services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: chat
      POSTGRES_PASSWORD: chat
      POSTGRES_DB: chat
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chat"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Local search backend for the web_search tool (admin → Tools points at
  # http://localhost:8081). JSON output + disabled limiter via mounted config.
  searxng:
    image: docker.io/searxng/searxng
    ports:
      - "8081:8080"
    volumes:
      - ./infra/searxng/settings.yml:/etc/searxng/settings.yml:ro

volumes:
  pgdata:
