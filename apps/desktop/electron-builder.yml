# Packaging for release builds (`pnpm package`). Unsigned: macOS gets an
# ad-hoc signature so Apple Silicon will run it, and Gatekeeper still asks on
# first launch; Windows shows SmartScreen. Signing needs certificates, not code.
#
# Only `dependencies` are packed. esbuild bundles everything else into dist/,
# which is why effect, diff and friends are devDependencies of this package.
appId: app.neema.desktop
productName: neema
copyright: Copyright © Nico Franke
artifactName: ${productName}-${version}-${os}-${arch}.${ext}

directories:
  output: release
  buildResources: build-resources

files:
  - dist/**/*
  - "!dist/**/*.map"
  - static/**/*
  - "!static/icons/*.svg"
  - package.json

# The MXC SDK loads its native library from a path beside its own modules,
# which an asar cannot serve, so the app stays a plain directory, as in dev.
asar: false

# Keeps only the target's own natives: MXC ships every platform's binaries.
afterPack: ./after-pack.mjs

protocols:
  - name: neema sign-in
    schemes: [chat-desktop]

mac:
  icon: static/icons/icon.png
  category: public.app-category.productivity
  target: [dmg, zip]
  identity: "-"
  hardenedRuntime: false

win:
  icon: static/icons/icon.png
  target: [nsis]

nsis:
  # Installs for the current user unless the person picks everyone, so no
  # administrator is needed. Commands reach the app under the profile through an
  # explicit read grant (the ssh bridge runs its executable).
  perMachine: false
  oneClick: false
  allowToChangeInstallationDirectory: true

linux:
  # Otherwise derived from the package name, whose @ and / Linux targets refuse.
  executableName: neema
  icon: static/icons/icon.png
  category: Utility
  target: [AppImage, deb]
  maintainer: Nico Franke <nico.franke01@gmail.com>
  synopsis: neema desktop shell

publish: null
