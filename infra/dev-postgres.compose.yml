# Separate from the personal instance in docker-compose.yml.
services:
  postgres:
    extends:
      file: ./postgres-base.compose.yml
      service: postgres-base
    environment:
      POSTGRES_USER: chat_dev_admin
      POSTGRES_PASSWORD: local-development-only
      POSTGRES_DB: postgres
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chat_dev_admin -d postgres"]
      interval: 1s
      timeout: 3s
      retries: 30
volumes:
  pgdata:
