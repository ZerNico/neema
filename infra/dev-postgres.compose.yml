# Separate from the personal instance in docker-compose.yml.
services:
  postgres:
    image: pgvector/pgvector:pg17@sha256:cf134a767f474095eeba57e0117be8e568e011a63f33fbf252f14c9b760f8e6f
    environment:
      POSTGRES_USER: chat_dev_admin
      POSTGRES_PASSWORD: local-development-only
      POSTGRES_DB: postgres
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chat_dev_admin -d postgres"]
      interval: 1s
      timeout: 3s
      retries: 30
volumes:
  pgdata:
