# Development-only SearXNG configuration.
# The json format is required for the chat app's web_search tool; the limiter
# is off and the secret is checked in because this instance is local-only.
# Rotate secret_key and re-enable the limiter before exposing this anywhere.
use_default_settings: true

server:
  limiter: false
  secret_key: "dev-only-change-before-exposing-searxng"

search:
  formats:
    - html
    - json
  # Let rate-limited engines rest rather than retrying every three minutes.
  # Keep the default CAPTCHA backoffs (including the longer CF/reCAPTCHA ones).
  suspended_times:
    SearxEngineTooManyRequests: 900

outgoing:
  # Stay below the chat backend's ten-second HTTP timeout.
  request_timeout: 7.0
  max_request_timeout: 8.0
  retries: 0

# Every query fans out to every enabled engine in the general category at once.
# Measured from a home connection with a 15-query burst (Sept 2026): Google CSE
# answered 15/15 with nearly all results on topic, Yep 14/15, Yandex 15/15 with
# some noise. Bing answers but, under bot suspicion, serves unrelated pages
# instead of an error; the other engines kept it from dominating a run. It stays
# as a fallback. DuckDuckGo, Qwant and Startpage returned CAPTCHAs and Brave
# rate limits on the first query, so they only add suspensions and latency.
# Google CSE was CAPTCHA'd on bursts in an earlier test; if it is again, the
# others still carry the query.
engines:
  - name: google cse
    disabled: false
  - name: yep
    disabled: false
  - name: yandex
    disabled: false
  - name: bing
    disabled: false
  - name: duckduckgo
    disabled: true
  - name: brave
    disabled: true
  - name: wikidata
    disabled: true
  - name: currency
    disabled: true
  - name: lingva
    disabled: true
  - name: dictzone
    disabled: true
  - name: mymemory translated
    disabled: true
  # Repeated CAPTCHA responses make this a poor default for local research.
  - name: startpage
    disabled: true
  # The default Wikipedia engine returns infoboxes, not the results the app uses.
  # Wikipedia pages can still appear in web results and be opened by read_url.
  - name: wikipedia
    disabled: true
