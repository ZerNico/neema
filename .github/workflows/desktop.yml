name: Desktop

# Unsigned installers for every platform, uploaded as workflow artifacts.
# release.yml attaches them to the release; a manual run is for trying a build.
# No native modules are rebuilt, so one runner cross-packages both architectures
# of its OS: microsandbox's native package for each is installed, and after-pack.mjs
# keeps only the target's. microsandbox has no Intel macOS build, so macOS is arm64.

on:
  workflow_dispatch:
    inputs:
      sandbox-image:
        description: Guest image as name:tag@digest. Empty follows edge.
        type: string
        required: false
  workflow_call:
    inputs:
      version:
        description: App version without the leading v.
        type: string
        required: true
      sandbox-image:
        description: Guest image as name:tag@digest, from sandbox-image.yml.
        type: string
        required: true

permissions:
  contents: read

env:
  # electron-builder downloads the Electron it packages; npm's copy is unused.
  ELECTRON_SKIP_BINARY_DOWNLOAD: "1"

jobs:
  package:
    name: package (${{ matrix.os }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos
            runner: macos-15
            targets: --mac --arm64
            smoke: release/mac-arm64/neema.app/Contents/MacOS/neema
            app: release/mac-arm64/neema.app/Contents/Resources/app
          - os: windows
            runner: windows-2025
            targets: --win --x64 --arm64
            smoke: release/win-unpacked/neema.exe
            app: release/win-unpacked/resources/app
          - os: linux
            runner: ubuntu-24.04
            targets: --linux --x64 --arm64
            smoke: release/linux-unpacked/neema
            app: release/linux-unpacked/resources/app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup
        with:
          cache: ${{ github.event_name == 'workflow_dispatch' }}

      - name: Install both architectures' natives
        run: pnpm install --frozen-lockfile --cpu=x64 --cpu=arm64

      - name: Build shell
        shell: bash
        env:
          SANDBOX_IMAGE_REF: ${{ inputs.sandbox-image }}
          RELEASE: ${{ inputs.version }}
        run: |
          # A release must boot exactly the image built for it, never whatever edge is.
          if [[ -n "$RELEASE" && "$SANDBOX_IMAGE_REF" != *@sha256:* ]]; then
            echo "::error::A release needs the sandbox image by digest, got '$SANDBOX_IMAGE_REF'"
            exit 1
          fi
          pnpm --filter @chat/desktop build

      - name: Package
        shell: bash
        working-directory: apps/desktop
        env:
          VERSION: ${{ inputs.version || format('0.0.0-dev.{0}', github.run_number) }}
          TARGETS: ${{ matrix.targets }}
          # Never pick up a signing identity by accident; macOS gets ad-hoc.
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: |
          read -ra targets <<< "$TARGETS"
          pnpm exec electron-builder --publish never "${targets[@]}" -c.extraMetadata.version="$VERSION"

      # The installer's extractor skips files whose filter it cannot decode, and still succeeds.
      - name: Check the installers' payloads
        if: matrix.os == 'windows'
        shell: bash
        working-directory: apps/desktop
        run: |
          # $PLUGINSDIR is NSIS's own folder name, quoted to stay literal, not a shell variable.
          # shellcheck disable=SC2016
          for installer in release/*.exe; do
            # Relative, so Git Bash hands 7z.exe a path it can read.
            out="payload-$(basename "$installer" .exe)"
            7z x -y -o"$out" "$installer" '$PLUGINSDIR/app-*.7z' >/dev/null
            methods=$(7z l -slt "$out"/'$PLUGINSDIR'/app-*.7z | grep '^Method = ' | sort -u)
            echo "$installer: $(tr '\n' ' ' <<< "$methods")"
            if grep -q ARM64 <<< "$methods"; then
              echo "::error::$installer compresses executables with 7-Zip's ARM64 filter"
              exit 1
            fi
          done

      # The runner's own architecture loads microsandbox from the packaged app.
      - name: Smoke-test the package
        shell: bash
        working-directory: apps/desktop
        env:
          ELECTRON_RUN_AS_NODE: "1"
          SMOKE: ${{ matrix.smoke }}
          APP: ${{ matrix.app }}
        run: |
          "$SMOKE" scripts/package-smoke.mjs "$PWD/$APP"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: desktop-${{ matrix.os }}
          path: |
            apps/desktop/release/*.dmg
            apps/desktop/release/*.zip
            apps/desktop/release/*.exe
            apps/desktop/release/*.AppImage
            apps/desktop/release/*.deb
          if-no-files-found: error
          retention-days: 7
