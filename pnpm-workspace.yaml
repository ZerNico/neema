# pnpm >= 11 reads non-auth settings from here, not .npmrc.
#
packages:
  - apps/*
  - packages/*

# Every package must resolve ONE copy of effect: two copies mean two Context
# key identities, so a service provided by one is invisible to the other and
# the failure is a silent missing-service at runtime, not a type error.
catalog:
  effect: 4.0.0-rc.117
  "@effect/sql-pg": 4.0.0-rc.117
  "@effect/vitest": 4.0.0-rc.117

# pnpm’s default 24h cooldown blunts the window in which a compromised release
# is live. It is kept on; the exclusions below are the packages this project
# deliberately tracks at same-day builds, where waiting a day means pinning a
# build we already know is superseded:
#   - drizzle-orm / drizzle-kit: pre-release `1.0.0-rc.N-<sha>` builds that must
#     stay a matched pair (see CLAUDE.md).
#   - rolldown (and its platform bindings): pinned through Vite whenever a build
#     regression forces a specific version.
#   - @tanstack/charts: pinned exact; its API moved between every release before 1.0.
# Add a package here only when its pin is exact and deliberate.
minimumReleaseAge: 1440
minimumReleaseAgeExclude:
  - drizzle-orm
  - drizzle-kit
  - rolldown
  - "@rolldown/*"
  - "@tanstack/charts"

# Install-time scripts, denied by default. esbuild has to fetch/link its
# platform binary or the dev server and test transform cannot start. The rest
# are optional native accelerations behind pure-JS fallbacks (msgpackr-extract
# for msgpackr, cpu-features for ssh2) or generated code we do not import
# (protobufjs) — they have been off since before pnpm required this list, and
# the integration suites that pull them in pass without them.
allowBuilds:
  # Fetches and links its platform binary; without it there is no app to run.
  electron: true
  esbuild: true
  cpu-features: false
  msgpackr-extract: false
  protobufjs: false
  ssh2: false
  # Squirrel.Windows tooling pulled in by electron-builder; the NSIS target
  # used for releases never runs it.
  electron-winstaller: false
  # Its CPU binaries ship in the package; the script only fetches CUDA ones.
  onnxruntime-node: false

# Behaviour these packages do not have upstream; see Version pins in AGENTS.md.
patchedDependencies:
  "@anthropic-ai/sandbox-runtime@0.0.77": patches/@anthropic-ai__sandbox-runtime@0.0.77.patch
  "@office-kit/pptx-preview@0.11.0": patches/@office-kit__pptx-preview@0.11.0.patch
