name: Desktop

# Unsigned installers for every platform, uploaded as workflow artifacts.
# release.yml attaches them to the release; a manual run is for trying a build.
# No native modules are rebuilt, so one runner cross-packages both architectures
# of its OS: koffi's binding for each is installed, and after-pack.mjs keeps
# only the target's natives. MXC has no Intel macOS backend, so macOS is arm64.

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      version:
        description: App version without the leading v.
        type: string
        required: true

permissions:
  contents: read

env:
  # electron-builder downloads the Electron it packages; npm's copy is unused.
  ELECTRON_SKIP_BINARY_DOWNLOAD: "1"

jobs:
  package:
    name: package (${{ matrix.os }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos
            runner: macos-15
            targets: --mac --arm64
            smoke: release/mac-arm64/neema.app/Contents/MacOS/neema
            app: release/mac-arm64/neema.app/Contents/Resources/app
          - os: windows
            runner: windows-2025
            targets: --win --x64 --arm64
            smoke: release/win-unpacked/neema.exe
            app: release/win-unpacked/resources/app
            # Not known whether GitHub's Windows Server image hosts the process container;
            # loading MXC's library still proves the package.
            smoke-mode: --load-only
          - os: linux
            runner: ubuntu-24.04
            targets: --linux --x64 --arm64
            smoke: release/linux-unpacked/neema
            app: release/linux-unpacked/resources/app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup
        with:
          cache: ${{ github.event_name == 'workflow_dispatch' }}

      - name: Install both architectures' natives
        run: pnpm install --frozen-lockfile --cpu=x64 --cpu=arm64

      - name: Build shell
        run: pnpm --filter @chat/desktop build

      - name: Package
        shell: bash
        working-directory: apps/desktop
        env:
          VERSION: ${{ inputs.version || format('0.0.0-dev.{0}', github.run_number) }}
          TARGETS: ${{ matrix.targets }}
          # Never pick up a signing identity by accident; macOS gets ad-hoc.
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: |
          read -ra targets <<< "$TARGETS"
          pnpm exec electron-builder --publish never "${targets[@]}" -c.extraMetadata.version="$VERSION"

      # The runner's own architecture runs one contained command from the packaged app.
      - name: Prepare the Linux sandbox
        if: matrix.os == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap slirp4netns
          # Ubuntu 24.04 confines unprivileged user namespaces, which bubblewrap needs.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Smoke-test the package
        shell: bash
        working-directory: apps/desktop
        env:
          ELECTRON_RUN_AS_NODE: "1"
          SMOKE: ${{ matrix.smoke }}
          APP: ${{ matrix.app }}
          MODE: ${{ matrix.smoke-mode }}
        run: |
          mkdir -p smoke-workspace
          "$SMOKE" scripts/package-smoke.mjs "$PWD/$APP" "$PWD/smoke-workspace" $MODE

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: desktop-${{ matrix.os }}
          path: |
            apps/desktop/release/*.dmg
            apps/desktop/release/*.zip
            apps/desktop/release/*.exe
            apps/desktop/release/*.AppImage
            apps/desktop/release/*.deb
          if-no-files-found: error
          retention-days: 7
